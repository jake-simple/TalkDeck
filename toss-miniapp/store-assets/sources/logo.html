<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 600px; height: 600px; overflow: hidden; }
  .wrap {
    width: 600px; height: 600px;
    background: linear-gradient(135deg, #6A6FCB 0%, #8A63D2 55%, #A85FD0 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  .stack { position: relative; width: 300px; height: 360px; }
  .card {
    position: absolute; left: 50%; top: 50%;
    width: 230px; height: 310px; border-radius: 28px;
    background: #ffffff;
    box-shadow: 0 18px 50px rgba(40,20,80,0.35);
    transform-origin: center bottom;
  }
  .c1 { transform: translate(-50%,-50%) rotate(-14deg); background: #EDE9FB; }
  .c2 { transform: translate(-50%,-50%) rotate(7deg); background: #F5F1FF; }
  .c3 {
    transform: translate(-50%,-50%) rotate(-2deg);
    display: flex; align-items: center; justify-content: center;
  }
  .qmark {
    font-size: 150px; font-weight: 800;
    background: linear-gradient(135deg, #6A6FCB, #A85FD0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1;
  }
  .dots { position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="stack">
      <div class="card c1"></div>
      <div class="card c2"></div>
      <div class="card c3">
        <div class="qmark">?</div>
        <div class="dots">
          <span class="dot" style="background:#FF6B8B"></span>
          <span class="dot" style="background:#5AC8C8"></span>
          <span class="dot" style="background:#F5C24B"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
